name: Monitor Beijing KW Notices

on:
  schedule:
    # 每小时第 17 分钟运行(避开整点拥塞,对免费版更稳)
    - cron: '17 * * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TARGET_URL: 'https://kw.beijing.gov.cn/zwgk/tzgg/'
          # 可选: 只推送标题含以下关键词的通知,留空表示全部推送
          # FILTER_KEYWORDS: '申报,公示,征集'
        run: python monitor.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change, skip commit"
          else
            git commit -m "chore: update monitor state [skip ci]"
            git push
          fi
